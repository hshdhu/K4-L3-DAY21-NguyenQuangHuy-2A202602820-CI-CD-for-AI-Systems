name: Income Model CI/CD
on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.dvc/config'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: income-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -v
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Authenticate to Cloud Storage
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json, os
          credentials = json.loads(os.environ['STORAGE_CREDENTIALS'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key in ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN'):
                  value = credentials.get(key)
                  if key != 'AWS_SESSION_TOKEN' and not value:
                      raise ValueError(f'Missing {key}')
                  if value:
                      if '\n' in value or '\r' in value:
                          raise ValueError('Invalid credential format')
                      f.write(f'{key}={value}\n')
              f.write('AWS_DEFAULT_REGION=us-east-1\n')
          PY
      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PY'
          import json, os
          with open('outputs/report.json') as f:
              report = json.load(f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"f1={report['f1_score']}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.joblib
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
        run: |
          python - <<'PY'
          import os, math
          f1 = float(os.environ['F1'])
          if not math.isfinite(f1) or not 0.65 <= f1 <= 1:
              raise SystemExit(f"FAILED: f1_score {f1} < 0.65 or invalid. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65")
          PY
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install "boto3==1.34.162"
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models
      - name: Authenticate to AWS
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PY'
          import json, os
          credentials = json.loads(os.environ['STORAGE_CREDENTIALS'])
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for key in ('AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN'):
                  value = credentials.get(key)
                  if key != 'AWS_SESSION_TOKEN' and not value:
                      raise ValueError(f'Missing {key}')
                  if value:
                      if '\n' in value or '\r' in value:
                          raise ValueError('Invalid credential format')
                      f.write(f'{key}={value}\n')
              f.write('AWS_DEFAULT_REGION=us-east-1\n')
          PY
      - name: Publish approved model
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PY'
          import os, boto3
          boto3.client('s3').upload_file('models/model.joblib', os.environ['ARTIFACT_BUCKET'], 'artifacts/current/model.joblib')
          PY
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            sudo systemctl restart income-api
            for attempt in $(seq 1 30); do
              if curl -fsS http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              sleep 2
            done
            exit 1
